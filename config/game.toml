# Recompiler input for default.xbe, written by xbe_symbols

[xbe]
path = "assets/default.xbe"
title = 0x4B4E0030
entry = 0x12075
xdk = 5849
out = "generated/game"
partitions = 256
code_sections = [".text", "OA001_CD", "OA00E_CD", "OA004_CD", "OA012_CD", "OA014_CD", "OA005_CD", "OA021_CD", "OA009_CD", "OA006_CD", "OA010_CD", "OA011_CD", "OA00D_CD", "D3D", "D3DX", "XGRPH", "DSOUND", "XNET", "XONLINE", "OA00A_CD", "OA015_CD", "OA019_CD", "OA008_CD", "OA007_CD", "OA00B_CD", "OA00C_CD", "OA013_CD", "OA017_CD", "OA018_CD", "XMV", "XPP"]
# _setjmp3: D3DX's JPEG reader longjmps back to it on a decode error
setjmp = [0x3D0950]
library = "PES5.dll"  # <exe>.dll, which the executable delay loads

# extra entry points
[functions]
# D3DX's JPEG reader stores these as callbacks (0x4F59BD, 0x4FD7C0); each follows a call into its longjmp error
# path with no ret between, so the analysis takes neither for an entry
0x004F5147 = ""
0x004FD6B7 = ""

